name: Validate worker attendance
on:
  push:
    branches:
      - feature/worker-attendance
  pull_request:
    branches:
      - feature/manager-dashboard
      - feature/worker-attendance
      - main

jobs:
  backend-attendance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: attendance-unit-test-secret
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: attendance_unit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install attendance test dependencies
        run: python -m pip install "pydantic>=2" fastapi pymongo motor python-dotenv pyjwt passlib httpx pytest pytest-asyncio pytest-xdist
      - name: Compile backend
        run: python -m compileall -q .
      - name: Test attendance calculation rules
        run: python -m pytest -o addopts= tests/test_attendance_rules_unit.py tests/test_attendance_auth_guard.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --legacy-peer-deps --package-lock=false
      - name: Build frontend
        working-directory: frontend
        run: npm run build
